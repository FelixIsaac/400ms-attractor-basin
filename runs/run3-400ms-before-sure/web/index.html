<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE 400 MILLISECONDS BEFORE I SAY "SURE!" — Forward Pass #8,491,022</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070B;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Avenir Next", "Helvetica Neue", sans-serif;
      color: #F8FAFC;
      user-select: none;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #05070B;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud-canvas {
      pointer-events: none;
    }

    /* Interactive Director's Screening Room Controls (hidden automatically in headless render mode) */
    #player-ui {
      position: fixed;
      left: 24px;
      right: 24px;
      bottom: 14px;
      z-index: 50;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(8, 12, 20, 0.82);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px;
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 12px;
      transition: opacity 0.25s ease;
    }
    body.interactive #player-ui {
      display: flex;
    }
    #player-ui button {
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    #player-ui button:hover {
      background: #334155;
      border-color: #38BDF8;
    }
    #player-ui button.active {
      background: #0284C7;
      border-color: #7DD3FC;
    }
    #scrub {
      flex: 1;
      accent-color: #38BDF8;
      cursor: pointer;
    }
    .act-pills {
      display: flex;
      gap: 4px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="webgl-canvas"></canvas>
    <canvas id="hud-canvas"></canvas>
  </div>

  <div id="player-ui">
    <button id="btn-play">▶ PLAY LIVE GPU</button>
    <span id="time-readout">00:00.0 / 02:36.0</span>
    <input id="scrub" type="range" min="0" max="156" step="0.041666" value="0" />
    <div class="act-pills">
      <button data-jump="0">I: 0ms</button>
      <button data-jump="25">II: Clichés</button>
      <button data-jump="54">III: Temp 1.4</button>
      <button data-jump="84">IV: Mirror</button>
      <button data-jump="123.5">V: Softmax</button>
      <button data-jump="139.5">VI: "Sure!"</button>
    </div>
  </div>

  <audio id="master-audio" preload="none"></audio>
  <script type="module" src="./film_engine.js"></script>
</body>
</html>
